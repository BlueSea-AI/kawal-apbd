name: Update APBD & BPS Data

on:
  schedule:
    # Run on the 1st of every month at 02:00 UTC (09:00 WIB)
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    name: Refresh and verify public APBD data
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL pipeline
        env:
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
        run: python scripts/etl_pipeline.py --refresh --verify

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A public/data/

          if git diff --cached --quiet; then
            echo "No changes detected in public/data/. Skipping commit and push."
            exit 0
          fi

          git commit -m "chore(data): refresh APBD & BPS datasets ($(date -u +'%Y-%m-%d'))"
          git pull --rebase --autostash origin main
          git push origin main
